services:
  postgres-test:
    profiles: ["integration"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: borza_test
      POSTGRES_USER: borza_test
      POSTGRES_PASSWORD: borza_test_only
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U borza_test -d borza_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  backend-postgres-test:
    profiles: ["integration"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@postgres-test:5432/borza_test
      MIGRATION_DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@postgres-test:5432/borza_test
      POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@postgres-test:5432/borza_test
      ACADEMY_ALLOW_DEMO_AUTH: "true"
      ALLOWED_HOSTS: testserver,localhost,127.0.0.1
      CORS_ORIGINS: http://testserver
    depends_on:
      postgres-test:
        condition: service_healthy
    command: ["python", "-m", "pytest", "tests/integration", "-q"]
