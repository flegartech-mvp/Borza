services:
  - type: web
    name: borza-academy-api
    runtime: docker
    plan: starter
    rootDir: .
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --timeout-keep-alive 5 --no-access-log
    preDeployCommand: alembic upgrade head
    healthCheckPath: /ready
    autoDeployTrigger: "off"
    envVars:
      - key: APP_NAME
        value: Borza Academy
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: ACADEMY_ALLOW_DEMO_AUTH
        value: "false"
      - key: CORS_ORIGINS
        value: https://borza-kappa.vercel.app
      - key: ALLOWED_HOSTS
        sync: false
