[project]
name = "borza-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.5",
    "apscheduler==3.11.3",
    "fastapi==0.140.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "rapidfuzz==3.14.5",
    "redis==7.4.1",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.51.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires the disposable PostgreSQL 16 integration profile",
]
