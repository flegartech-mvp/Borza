[project]
name = "borza-backend"
dynamic = ["version"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.18.5",
    "fastapi==0.140.3",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "sqlalchemy==2.0.51",
    "uvicorn[standard]==0.51.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "app.version.__version__" }

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires the disposable PostgreSQL 16 integration profile",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
