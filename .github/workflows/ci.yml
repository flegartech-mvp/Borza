name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: borza_test
          POSTGRES_USER: borza_test
          POSTGRES_PASSWORD: borza_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U borza_test -d borza_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - run: ruff format --check .
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing
      - name: Premium package safety tests
        working-directory: premium/ai-trading-bot
        run: pytest tests -q
      - run: alembic upgrade head
      - name: PostgreSQL and Valkey integration tests
        env:
          ENVIRONMENT: production
          DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@localhost:5432/borza_test
          MIGRATION_DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@localhost:5432/borza_test
          POSTGRES_TEST_DATABASE_URL: postgresql+psycopg://borza_test:borza_test_only@localhost:5432/borza_test
          EVENT_BUS_URL: redis://localhost:6379/0
          VALKEY_TEST_URL: redis://localhost:6379/0
          REALTIME_ENABLED: "true"
          ALLOWED_HOSTS: testserver,localhost,127.0.0.1
          CORS_ORIGINS: http://testserver
        run: pytest tests/integration -q
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npx playwright install --with-deps chromium
      - name: Browser user journeys
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_WS_URL: ""
        run: npm run test:e2e
      - name: Build with strict public endpoint validation
        env:
          BORZA_STRICT_PUBLIC_ENV: "true"
          NEXT_PUBLIC_API_URL: https://api.example.invalid
          NEXT_PUBLIC_WS_URL: wss://api.example.invalid/ws/news
        run: npm run build
      - run: npm audit --omit=dev
